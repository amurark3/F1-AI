# Dependabot keeps dependencies patched and surfaces known vulnerabilities.
# It opens PRs for version bumps and (independently) raises security alerts +
# fix PRs when a dependency has a published CVE/GHSA advisory.
# Docs: https://docs.github.com/code-security/dependabot
version: 2

updates:
  # ── Frontend (Next.js / React) ────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Batch low-risk minor/patch bumps into a single PR to cut noise.
      # Security updates and majors still get their own dedicated PRs.
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # ── Backend (Python) ──────────────────────────────────────────────────────
  # Covers requirements.txt, requirements-ingest.txt, and requirements-train.txt
  # (Dependabot scans all requirements*.txt in the directory).
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ["dependencies", "backend"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      pip-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # ── GitHub Actions ────────────────────────────────────────────────────────
  # Keeps action versions (checkout, setup-python, codeql-action, …) current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: ci
