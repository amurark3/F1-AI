name: Ingest rulebook (pgvector)

# Re-embeds the FIA regulation PDFs into Supabase pgvector whenever the source
# PDFs change on main. The `paths` filter IS the change detection — this job
# only runs when a regulation PDF is added, updated, or removed, so you never
# have to remember to re-ingest. Also runnable on demand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "backend/data/raw/**"
  workflow_dispatch:
    inputs:
      backfill_only:
        # A re-ingest truncates the table and with it every Gemini vector, so
        # resuming a backfill that stopped on the daily quota must skip it.
        description: "Only fill missing Gemini vectors (skip the re-embed)"
        type: boolean
        default: false
  # Daily, just after the free tier's quota resets (midnight Pacific = 08:00 UTC
  # in winter): finishes a backfill that stopped on the 429 and refills vectors
  # after any re-ingest. A no-op once no row is missing one.
  schedule:
    - cron: "15 8 * * *"

concurrency:
  group: ingest-rulebook
  # A scheduled backfill queues behind a re-ingest instead of cancelling it
  # halfway (that would leave the table truncated).
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-ingest.txt

      - name: Install ingest dependencies (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ingest.txt

      - name: Re-embed rulebook into pgvector
        # A scheduled run has no inputs; it must never re-embed (that truncates).
        if: ${{ github.event_name != 'schedule' && !inputs.backfill_only }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Embedding the corpus is the entire job, so this runner opts in to
          # loading the model. It is off by default because the deployed web
          # service cannot afford it — a runner has gigabytes, Render's free
          # instance has 512MB and gets OOM-killed. See app/config.py.
          ENABLE_LOCAL_MODELS: "true"
          # Optional: set a HF_TOKEN repo secret for faster/rate-limit-free model
          # downloads. Works without it.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m app.rag.ingest --force

      - name: Fill Gemini vectors (resumable)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # The AI Studio key from the no-billing project (free tier). A spent
          # daily quota stops cleanly; run again with backfill_only to continue.
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python -m app.rag.gemini_backfill
