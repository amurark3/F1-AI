services:
  - type: web
    # Must exactly match the existing Render service name (Settings → General →
    # Name) so the Blueprint adopts it (keeps f1-ai.onrender.com) instead of
    # creating a duplicate.
    name: F1-AI
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    healthCheckPath: /api/health
    autoDeploy: true
    # Fast build:
    #   1) CPU-only torch first (from the PyTorch CPU index) so we don't pull the
    #      ~2GB CUDA build via sentence-transformers — the biggest build-time win.
    #   2) lean runtime deps only. Rulebook/PDF ingest deps live in
    #      requirements-ingest.txt (not installed here); rulebook vectors live in
    #      pgvector, populated once via `python -m app.rag.ingest` — nothing is
    #      built at deploy time.
    # NOTE: plain pip (not uv). `uv pip install --system` on Render installed the
    # console scripts off the runtime PATH, so `uvicorn` wasn't found at start
    # (exit 127). pip installs into Render's active env, so the CLI resolves.
    buildCommand: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # Values for `sync: false` vars are set in the Render dashboard and preserved
    # across Blueprint syncs. Declaring them here so adoption never drops them.
    envVars:
      - key: GROQ_API_KEY          # required — the LLM engine (Groq)
        sync: false
      # Required — Supabase Postgres + pgvector. MUST be the Supavisor session
      # pooler host (aws-<n>-<region>.pooler.supabase.com:5432), never the direct
      # db.<ref>.supabase.co: the direct endpoint is IPv6-only and Render's
      # egress is IPv4, so the app silently falls back to an ephemeral local file
      # that every cold start erases. See DEPLOYMENT.md.
      - key: DATABASE_URL
        sync: false
      - key: TAVILY_API_KEY        # optional — web search tool
        sync: false
      - key: OPENWEATHERMAP_API_KEY # optional — live weather (falls back to historical)
        sync: false
      - key: ALLOWED_ORIGINS       # CORS: comma-separated frontend origin(s)
        sync: false
      - key: HF_TOKEN              # optional — faster HuggingFace model downloads
        sync: false
      # Must stay false on the free tier. Loading the sentence-transformers
      # embedder and cross-encoder reranker in-process exhausts the 512MB
      # instance: one rulebook query OOM-killed the container in production and
      # every endpoint was down until Render restarted it. Rulebook search and
      # conversation-memory recall are disabled while this is off; chat and
      # predictions are unaffected. See backend/app/config.py.
      - key: ENABLE_LOCAL_MODELS
        value: "false"
      - key: PYTHON_VERSION
        value: 3.10.12
