name: PR auto review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-auto-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend_lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  frontend_build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build app
        run: npm run build

  backend_syntax:
    name: Backend syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Compile Python sources
        run: python -m compileall app main.py mcp_server.py

  backend_lint:
    name: Backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # Ruff is a standalone binary with no project dependencies, so the lint
      # gate does not need the runtime pins installed — it stays fast and cannot
      # be broken by an unrelated dependency resolution failure.
      - name: Install Ruff
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      - name: Check formatting
        run: ruff format --check .
      - name: Run Ruff
        run: ruff check --output-format github .
      # Ruff has no per-module line budget rule, so the size gate is its own step.
      - name: Check module size budget
        run: python -m tools.check_module_size

  backend_tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ingest.txt
            backend/requirements-dev.txt
      # Runtime pins are installed alongside the test pins so a Dependabot bump
      # to a runtime package is exercised by the suite, not just parsed by the
      # syntax check. DATABASE_URL is deliberately unset: the document store
      # falls back to JSON, keeping the suite hermetic.
      #
      # requirements-ingest.txt (which pulls in requirements.txt) is installed
      # too: app/rag/ingest.py imports PyPDFLoader and the text splitter at
      # module level, so tests/test_rag_ingest.py cannot even be collected
      # without them — and the 100% coverage gate requires that module to run.
      - name: Install dependencies
        run: pip install -r requirements-ingest.txt -r requirements-dev.txt
      # --cov is passed here rather than living in pytest.ini `addopts`, because
      # `fail_under = 100` would then trip on every single-file run during local
      # development. The consequence is that the coverage gate only exists where
      # it is asked for: this step and the pre-commit hook. Dropping the flag
      # would leave .coveragerc's fail_under configured but never evaluated.
      - name: Run pytest with the coverage gate
        run: pytest -q --cov --cov-report=term-missing

  review_summary:
    name: Review summary comment
    runs-on: ubuntu-latest
    if: always()
    needs: [frontend_lint, frontend_build, backend_syntax, backend_lint, backend_tests]
    steps:
      - name: Publish PR review summary
        uses: actions/github-script@v9
        with:
          script: |
            const marker = "<!-- pr-auto-review-summary -->";
            const statuses = {
              frontendLint: "${{ needs.frontend_lint.result }}",
              frontendBuild: "${{ needs.frontend_build.result }}",
              backendSyntax: "${{ needs.backend_syntax.result }}",
              backendLint: "${{ needs.backend_lint.result }}",
              backendTests: "${{ needs.backend_tests.result }}",
            };

            const toBadge = (result) => {
              if (result === "success") return "✅ passed";
              if (result === "failure") return "❌ failed";
              if (result === "cancelled") return "⚠️ cancelled";
              return "⏭️ skipped";
            };

            const failures = [];
            if (statuses.frontendLint !== "success") {
              failures.push("- **Frontend lint** failed. Suggestion: run `npm run lint` in `/frontend` and fix the reported ESLint issues.");
            }
            if (statuses.frontendBuild !== "success") {
              failures.push("- **Frontend build** failed. Suggestion: run `npm run build` in `/frontend` and resolve build/type errors before pushing.");
            }
            if (statuses.backendSyntax !== "success") {
              failures.push("- **Backend syntax check** failed. Suggestion: run `python -m compileall app main.py mcp_server.py` in `/backend` and fix invalid Python files.");
            }
            if (statuses.backendLint !== "success") {
              failures.push("- **Backend lint** failed. Suggestion: in `/backend` run `ruff format .`, then `ruff check .` and `python -m tools.check_module_size`, and fix what they report.");
            }
            if (statuses.backendTests !== "success") {
              failures.push("- **Backend tests** failed. Suggestion: run `pytest -q --cov` in `/backend` and fix the failing tests — or the coverage shortfall — before merging.");
            }

            const improvementTips = [
              "- Add or update tests for changed behavior so future PRs catch regressions early.",
              "- Keep PRs focused by splitting unrelated changes into separate pull requests.",
              "- Include a short validation note in the PR description (what was run and what passed).",
            ];

            const hasFailures = failures.length > 0;
            const title = hasFailures
              ? "## 🤖 Automated PR review found issues"
              : "## 🤖 Automated PR review passed";

            const body = [
              marker,
              title,
              "",
              "### Check results",
              `- Frontend lint: ${toBadge(statuses.frontendLint)}`,
              `- Frontend build: ${toBadge(statuses.frontendBuild)}`,
              `- Backend syntax check: ${toBadge(statuses.backendSyntax)}`,
              `- Backend lint: ${toBadge(statuses.backendLint)}`,
              `- Backend tests: ${toBadge(statuses.backendTests)}`,
              "",
              hasFailures ? "### Issues and suggested fixes" : "### Suggested improvements",
              ...(hasFailures ? failures : improvementTips),
              "",
              `[View full workflow logs](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
