[pytest]
testpaths = tests
# Tests import the service as `app.*`, which only resolves when the backend
# root is on sys.path. Setting it here means `pytest` works from a bare
# invocation — no PYTHONPATH export needed by hooks, CI or editors.
pythonpath = .
markers =
    unit: fast, isolated tests with no external dependencies
    integration: tests that touch the database, filesystem or network
