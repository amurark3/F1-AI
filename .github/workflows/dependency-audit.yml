name: Dependency audit

# Scans dependencies for known vulnerabilities (CVE/GHSA) on every PR, on pushes
# to main, and weekly (to catch advisories published after a PR merged).
# Complements Dependabot: Dependabot bumps versions, this fails the build when a
# vulnerable dependency slips in.
on:
  pull_request:
    paths:
      - "frontend/package-lock.json"
      - "frontend/package.json"
      - "frontend/audit-ci.jsonc"
      - "backend/requirements*.txt"
      - ".github/workflows/dependency-audit.yml"
  push:
    branches: [main]
    paths:
      - "frontend/package-lock.json"
      - "frontend/package.json"
      - "frontend/audit-ci.jsonc"
      - "backend/requirements*.txt"
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC — catch newly disclosed advisories
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm_audit:
    name: Frontend npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Fail only on high/critical so low-severity advisories with no fix don't
      # block delivery. Tighten to `low` once the tree is clean.
      # audit-ci runs `npm audit` with a path-scoped allowlist for advisories
      # that have no published fix — see frontend/audit-ci.jsonc for each entry
      # and why it is tolerated.
      - name: npm audit (high+)
        run: npx --yes audit-ci@7.1.0 --config audit-ci.jsonc

  pip_audit:
    name: Backend pip-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install pip-audit
        run: pip install pip-audit
      # Resolves the full pinned dependency tree (including transitive deps) for
      # each manifest and checks every package against the PyPI advisory DB.
      # requirements-ingest.txt already pulls in requirements.txt via `-r`.
      #
      # One resolve per manifest, because they are installed separately and may
      # pin the same package differently: requests is held at 2.33.1 for FastF1
      # in requirements.txt but is 2.34.2 in the FastF1-free training set. A
      # single `-r ingest -r train` resolve is unsatisfiable and fails before
      # auditing anything.
      - name: pip-audit (runtime + ingest)
        run: pip-audit --progress-spinner off -r requirements-ingest.txt
      # Run even if the step above found something, so both manifests report.
      - name: pip-audit (training)
        if: ${{ !cancelled() }}
        run: pip-audit --progress-spinner off -r requirements-train.txt
