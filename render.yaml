# ⚠️ THIS FILE IS NOT APPLIED. Render only reads render.yaml for Blueprint-managed
# services, and Blueprints require payment info on the account — this project is on
# the free tier and the web service was created by hand. Editing anything here
# changes nothing about the deployment.
#
# The **Render dashboard is the source of truth** (Settings → Build & Deploy, and
# Environment). This file is reference documentation of what those fields should
# contain: change a value here and you must paste the same change into the
# dashboard, or it never ships. See DEPLOYMENT.md §4.
services:
  - type: web
    # Matches the dashboard service name; keeps f1-ai.onrender.com.
    name: F1-AI
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    healthCheckPath: /api/health
    autoDeploy: true
    # One command, deliberately. requirements.txt carries no torch —
    # sentence-transformers lives in requirements-ingest.txt because every import
    # of it is gated on ENABLE_LOCAL_MODELS, which must stay false here. Rulebook
    # vectors live in pgvector, populated once via `python -m app.rag.ingest`, so
    # nothing is built at deploy time either.
    #
    # `--upgrade pip` is not decoration: Render's image ships pip 23.0.1, which
    # is what actually broke the deploy this replaced. See DEPLOYMENT.md §3.
    # Safe to do blindly because every runtime dep is `==` pinned, so a newer pip
    # changes resolution mechanics, never the versions installed.
    #
    # Do NOT reintroduce a `pip install torch --index-url .../whl/cpu` step —
    # that is what this replaced. See DEPLOYMENT.md §3 before adding torch back.
    #
    # NOTE: plain pip (not uv). `uv pip install --system` on Render installed the
    # console scripts off the runtime PATH, so `uvicorn` wasn't found at start
    # (exit 127). pip installs into Render's active env, so the CLI resolves.
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # Every var below is set in the dashboard (Environment). `sync: false` is the
    # Blueprint keyword for "value lives in the dashboard"; it has no effect here
    # and is kept only so this file stays a valid, copy-pasteable Blueprint if the
    # service is ever put on a paid plan. The listing itself is the useful part —
    # it records which vars the service needs.
    envVars:
      - key: GROQ_API_KEY          # required — the LLM engine (Groq)
        sync: false
      # Required — Supabase Postgres + pgvector. MUST be the Supavisor session
      # pooler host (aws-<n>-<region>.pooler.supabase.com:5432), never the direct
      # db.<ref>.supabase.co: the direct endpoint is IPv6-only and Render's
      # egress is IPv4, so the app silently falls back to an ephemeral local file
      # that every cold start erases. See DEPLOYMENT.md.
      - key: DATABASE_URL
        sync: false
      - key: TAVILY_API_KEY        # optional — web search tool
        sync: false
      - key: OPENWEATHERMAP_API_KEY # optional — live weather (falls back to historical)
        sync: false
      - key: ALLOWED_ORIGINS       # CORS: comma-separated frontend origin(s)
        sync: false
      - key: HF_TOKEN              # optional — faster HuggingFace model downloads
        sync: false
      # Must stay false on the free tier. Loading the sentence-transformers
      # embedder and cross-encoder reranker in-process exhausts the 512MB
      # instance: one rulebook query OOM-killed the container in production and
      # every endpoint was down until Render restarted it. Rulebook search and
      # conversation-memory recall are disabled while this is off; chat and
      # predictions are unaffected. See backend/app/config.py.
      - key: ENABLE_LOCAL_MODELS
        value: "false"
      - key: PYTHON_VERSION
        value: 3.10.12
