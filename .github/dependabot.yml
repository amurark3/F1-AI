# Dependabot — SECURITY-ONLY configuration.
#
# We do NOT want a PR for every routine version bump. So scheduled *version
# updates* are disabled below via `open-pull-requests-limit: 0` on each
# ecosystem.
#
# *Security updates* are unaffected: they are driven by published CVE/GHSA
# advisories, enabled in repo Settings → Code security ("Dependabot alerts" +
# "Dependabot security updates"), and use a separate internal PR limit (10) that
# `open-pull-requests-limit` does not touch. So Dependabot will still open a PR
# whenever a dependency has a known vulnerability — and only then.
#
# To re-enable routine version bumps for an ecosystem, raise its limit (e.g. 10)
# and restore a `groups:` block to batch minor/patch updates.
# Docs: https://docs.github.com/code-security/dependabot
version: 2

updates:
  # ── Frontend (Next.js / React) ────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0 # security updates only — no version-bump PRs
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: chore
      include: scope

  # ── Backend (Python) ──────────────────────────────────────────────────────
  # Covers requirements.txt, requirements-ingest.txt, and requirements-train.txt
  # (Dependabot scans all requirements*.txt in the directory).
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0 # security updates only — no version-bump PRs
    labels: ["dependencies", "backend"]
    commit-message:
      prefix: chore
      include: scope

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0 # security updates only — no version-bump PRs
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: ci
